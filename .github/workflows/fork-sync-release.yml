name: Fork Sync & Release

# 同步策略：只有上游（pt-plugins/PT-depiler）发布新 release 时才同步。
# Actions 无法跨仓库监听别人的 release，因此定时轮询检查上游最新 release tag，
# 用 git tag upstream/<tag> 记录已同步版本，只有 tag 变化才合并 + 构建 + 发布。

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时检查一次上游 release（仅比对 tag）
  workflow_dispatch:
    inputs:
      force:
        description: "强制同步（忽略 tag 比对）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check upstream latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/pt-plugins/PT-depiler/releases/latest --jq '.tag_name')
          if [ -z "$LATEST" ]; then echo "::error::no upstream release"; exit 1; fi
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "::notice::upstream latest release: $LATEST"
          if [ "$FORCE" = "true" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/upstream/$LATEST" >/dev/null; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "::notice::already synced, skip"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "::notice::new upstream release, will sync"
          fi

  sync:
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pt-plugins/PT-depiler.git
          git fetch upstream master
      - name: Merge upstream (no force push)
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/master; then
            AFTER=$(git rev-parse HEAD)
            git push origin master
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_ENV"
          fi
      - name: Mark release as synced
        if: success() && env.conflict != 'true'
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "upstream/$TAG"
          git push origin "refs/tags/upstream/$TAG" --force
      - name: Open conflict issue
        if: env.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "上游同步冲突：master",
              body: "与 upstream/master 合并冲突，未强推、未覆盖。请手动合并后重试。"
            })

  release:
    needs: [check, sync]
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ">=23.7.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build Chrome extension
        run: pnpm build:dist
      - name: Read version
        id: ver
        run: |
          VER=$(node -p "require('./dist-chrome/manifest.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Pack zip
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: dist-chrome
          zipFilePath: build/extension-chrome.zip
      - name: Sign CRX with fixed key
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: build/extension-chrome.zip
          crxFilePath: build/extension.crx
          privateKey: ${{ secrets.CHROME_SELF_SIGN_CRX_PRIVATE_KEY }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: false
          files: |
            build/extension-chrome.zip
            build/extension.crx
            dist-chrome/manifest.json
