name: Fork Sync & Release

# 同步策略：只有上游发布新 release 时才合并上游代码。
# 发布策略：只要 master 有未发布的新 commit（含本地功能提交与上游同步），就构建并发布签名 CRX。

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时检查上游 release（仅比对 tag）
  workflow_dispatch:
    inputs:
      force:
        description: "强制同步（忽略上游 tag 比对）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check upstream latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/pt-plugins/PT-depiler/releases/latest --jq '.tag_name')
          if [ -z "$LATEST" ]; then echo "::error::no upstream release"; exit 1; fi
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "::notice::upstream latest release: $LATEST"
          if [ "$FORCE" = "true" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/upstream/$LATEST" >/dev/null; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "::notice::already synced, skip"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "::notice::new upstream release, will sync"
          fi

  sync:
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pt-plugins/PT-depiler.git
          git fetch upstream master
      - name: Merge upstream (no force push)
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/master
          git push origin master
      - name: Mark release as synced
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "upstream/$TAG"
          git push origin "refs/tags/upstream/$TAG" --force
      - name: Open conflict issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "上游同步冲突：master",
              body: "与 upstream/master 合并冲突，未强推、未覆盖。请手动合并后重试。"
            })

  release:
    needs: [check, sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Check for unpublished commits
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no previous release, will publish"; exit 0
          fi
          LAST_SHA=$(git rev-list -n1 "refs/tags/$LAST" 2>/dev/null || true)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$HEAD_SHA" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no new commits since last release, skip"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::new commits found, will publish"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.should_publish == 'true'
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.should_publish == 'true'
        with:
          node-version: ">=23.7.0"
          cache: pnpm
      - name: Install dependencies
        if: steps.gate.outputs.should_publish == 'true'
        run: pnpm install
      - name: Build Chrome extension
        if: steps.gate.outputs.should_publish == 'true'
        run: pnpm build:dist
      - name: Read version
        if: steps.gate.outputs.should_publish == 'true'
        id: ver
        run: |
          VER=$(node -p "require('./dist-chrome/manifest.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Pack zip
        if: steps.gate.outputs.should_publish == 'true'
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: dist-chrome
          zipFilePath: build/extension-chrome.zip
      - name: Sign CRX with fixed key
        if: steps.gate.outputs.should_publish == 'true'
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: build/extension-chrome.zip
          crxFilePath: build/extension.crx
          privateKey: ${{ secrets.CHROME_SELF_SIGN_CRX_PRIVATE_KEY }}
      - name: Publish release
        if: steps.gate.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: false
          files: |
            build/extension-chrome.zip
            build/extension.crx
            dist-chrome/manifest.json
